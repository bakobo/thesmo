name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run tests (100% branch coverage gate)
        run: uv run pytest
