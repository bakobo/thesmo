[project]
name = "thesmo"
version = "0.0.0"
description = "A Gever: the Custos governance fold, built blind as an instrument for falsifying the standard."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]

# No runtime dependencies, deliberately. Custos §1.4 axiom 2 closes the fold's
# inputs at exactly three committed values, so the evaluator needs no KERI
# library (this.i @q6hqa4). keripy arrives at M3 as a dependency of the
# substrate adapter only, and the purity test in tests/ keeps it out of core/.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=thesmo --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["thesmo"]
